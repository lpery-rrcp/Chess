<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Board Setup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page-mode="swap">
    <main class="app-shell">
      <h1 class="app-title">Prepare the Board</h1>
      <p id="turn-indicator" class="turn-indicator">Choose a side and swap pieces before starting</p>
      <div class="board-actions">
        <button id="setup-mode-button" class="swap-button" type="button">Custom Setup</button>
        <button id="reset-board-button" class="swap-button" type="button">Reset Board</button>
        <button id="start-game-button" class="swap-button" type="button">Start Game</button>
      </div>
      <p id="swap-help" class="swap-help">Choose a color, pick the piece to replace, and use the board to swap two eligible pieces or replace all matching pieces.</p>
      <div id="setup-controls" class="setup-controls" hidden>
        <div class="setup-side-picker">
          <button class="setup-side-button active" data-setup-side="white" type="button">White</button>
          <button class="setup-side-button" data-setup-side="black" type="button">Black</button>
        </div>
        <div class="setup-piece-picker">
          <button class="setup-piece-button active" data-setup-piece="r" type="button">Rook</button>
          <button class="setup-piece-button" data-setup-piece="n" type="button">Knight</button>
          <button class="setup-piece-button" data-setup-piece="b" type="button">Bishop</button>
          <button class="setup-piece-button" data-setup-piece="z" type="button">Wizard</button>
          <button class="setup-piece-button" data-setup-piece="clear" type="button">Clear</button>
        </div>
        <button id="default-board-button" class="swap-button" type="button">Default Board</button>
      </div>
      <div id="bulk-swap-controls" class="swap-controls">
        <div class="swap-control-grid">
          <label class="swap-control">
            <span>Color</span>
            <select id="swap-side-select" class="swap-select">
              <option value="white">White</option>
              <option value="black">Black</option>
            </select>
          </label>
          <label class="swap-control">
            <span>Replace</span>
            <select id="swap-from-select" class="swap-select">
              <option value="r">Rook</option>
              <option value="n">Knight</option>
              <option value="b">Bishop</option>
              <option value="z">Wizard</option>
              <option value="q">Queen</option>
              <option value="k">King</option>
              <option value="p">Pawn</option>
            </select>
          </label>
          <label class="swap-control">
            <span>With</span>
            <select id="swap-to-select" class="swap-select">
              <option value="r">Rook</option>
              <option value="n">Knight</option>
              <option value="b">Bishop</option>
              <option value="z">Wizard</option>
              <option value="q">Queen</option>
              <option value="k">King</option>
              <option value="p">Pawn</option>
            </select>
          </label>
        </div>
        <button id="swap-all-button" class="swap-button" type="button">Swap all matching pieces</button>
      </div>
      <div id="chess-board" class="chessBoard" aria-label="Chess board"></div>
    </main>

    <script>
      const cacheBuster = Date.now();
      document.write('<script src="chessRules.js?v=' + cacheBuster + '"><\/script>');
      document.write('<script src="chessmovement.js?v=' + cacheBuster + '"><\/script>');
      document.write('<script src="main.js?v=' + cacheBuster + '"><\/script>');
    </script>
  </body>
</html>
